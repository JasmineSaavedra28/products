openapi: "3.0.0"
info:
  title: "API de Productos (Products API)"
  description: >-
    API RESTful básica para administrar un catálogo de productos, construida
    con Flask, Connexion, SQLAlchemy, Marshmallow y SQLite.
  version: "1.0.0"

tags:
  - name: "Products"
    description: "Operaciones sobre el catálogo de productos"

paths:
  /api/products:
    get:
      operationId: "products_api.controllers.products.read_all"
      tags:
        - "Products"
      summary: "Obtener la lista completa de productos"
      responses:
        "200":
          description: "Lista de productos obtenida con éxito"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Product"

    post:
      operationId: "products_api.controllers.products.create"
      tags:
        - "Products"
      summary: "Crear un nuevo producto"
      requestBody:
        required: true
        x-body-name: "product"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "201":
          description: "Producto creado con éxito"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "406":
          description: "Ya existe un producto con ese nombre"

  /api/products/{nombre}:
    get:
      operationId: "products_api.controllers.products.read_one"
      tags:
        - "Products"
      summary: "Obtener un producto por su nombre"
      parameters:
        - $ref: "#/components/parameters/nombre"
      responses:
        "200":
          description: "Producto encontrado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: "Producto no encontrado"

    put:
      operationId: "products_api.controllers.products.update"
      tags:
        - "Products"
      summary: "Actualizar un producto existente"
      parameters:
        - $ref: "#/components/parameters/nombre"
      requestBody:
        required: true
        x-body-name: "product"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "200":
          description: "Producto actualizado con éxito"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: "Producto no encontrado"

    delete:
      operationId: "products_api.controllers.products.delete"
      tags:
        - "Products"
      summary: "Eliminar un producto"
      parameters:
        - $ref: "#/components/parameters/nombre"
      responses:
        "200":
          description: "Producto eliminado con éxito"
          content:
            text/plain:
              schema:
                type: "string"
        "404":
          description: "Producto no encontrado"

components:
  schemas:
    Product:
      type: "object"
      required:
        - nombre
        - marca
        - precio
      properties:
        id:
          type: "integer"
          readOnly: true
          description: "Identificador autoincremental del producto"
        nombre:
          type: "string"
          maxLength: 100
          description: "Nombre único del producto"
        marca:
          type: "string"
          maxLength: 100
          description: "Marca o fabricante del producto"
        precio:
          type: "number"
          format: "float"
          description: "Precio del producto"
        timestamp:
          type: "string"
          format: "date-time"
          readOnly: true
          description: "Fecha y hora de creación/última modificación"

  parameters:
    nombre:
      name: "nombre"
      in: "path"
      required: true
      description: "Nombre único del producto"
      schema:
        type: "string"
